# ============================================================
# Bond Yield Forecast — Quarterly Configuration
# Edit this file each quarter before running main.py
# ============================================================

quarter: "Q2 2026"
run_date: "2026-05-27"

# API Keys
# You can also set these as environment variables:
#   FRED_API_KEY and ANTHROPIC_API_KEY
fred_api_key: ""        # Leave blank — loaded from .env or FRED_API_KEY env var
anthropic_api_key: ""   # Leave blank — loaded from .env or ANTHROPIC_API_KEY env var

# ============================================================
# FORECAST TARGETS
# ============================================================
us_10y:
  target: 4.2          # Long-term target in percent
  horizon: "long-term (5–10 year)"

canada_10y:
  target: 4.0          # Long-term target in percent
  horizon: "long-term (5–10 year)"

# Long-run Fed Funds rate assumption (FOMC SEP long-run dot)
long_run_fed_funds: 3.125

# Long-run Bank of Canada overnight rate assumption
long_run_boc_rate: 2.75

# FOMC SEP long-run real GDP growth and PCE inflation target
# Used in Framework 3: implied 10Y = real_gdp_growth + pce_inflation
long_run_real_gdp_growth: 2.15
long_run_pce_inflation: 2.00

# ============================================================
# MACRO THEMES
# These drive the AI-drafted Forecasting Rationale section.
# Update each quarter to reflect the current narrative.
# ============================================================
macro_themes:
  - "Fed holding rates higher-for-longer amid sticky services inflation"
  - "Fiscal deficit concerns and elevated Treasury supply adding to term premium"
  - "Canada-US spread compression as BoC cuts ahead of Fed, narrowing policy rate differential"
  - "Gradual disinflation trend intact but last-mile inflation proving persistent"
  - "Strong labour markets supporting neutral rate estimates above pre-pandemic levels"

# ============================================================
# MEDIUM-TERM RISKS (3–5 Years)
# Add or remove bullets as appropriate each quarter.
# ============================================================
medium_term_risks:
  upside:   # Risks that would push yields HIGHER than forecast
    - "Re-acceleration of inflation forces the Fed to resume hiking, pushing short rates above current path"
    - "US debt supply shock if fiscal consolidation fails, widening term premium by 30–50 bps"
    - "Geopolitical fragmentation accelerates deglobalization, sustaining goods inflation"
    - "Neutral rate (r*) re-estimation higher as AI investment boosts capital demand"
  downside:   # Risks that would push yields LOWER than forecast
    - "Recession triggers aggressive Fed cutting cycle, flattening the path of short rates"
    - "AI-driven productivity boom leads to disinflationary growth, compressing risk-free rates"
    - "Credit event or financial stress triggers flight-to-quality demand for Treasuries"
    - "Faster-than-expected disinflation allows earlier and deeper Fed easing"

# ============================================================
# LONG-TERM RISKS (5–10 Years)
# Structural, secular factors on a decade horizon.
# ============================================================
long_term_risks:
  upside:   # Structural forces pushing yields permanently higher
    - "Structural fiscal deterioration — defence spending, entitlements, and interest costs lift r*"
    - "Deglobalization and supply chain reshoring sustain a higher inflation equilibrium"
    - "Global reserve diversification away from USD reduces demand for US Treasuries"
    - "Climate transition capex creates sustained demand for long-duration capital"
  downside:   # Structural forces pushing yields permanently lower
    - "Demographics and population aging suppress long-run consumption and investment"
    - "Debt deflation spiral if fiscal sustainability concerns materialize in a disorderly way"
    - "Persistent technological deflation from AI compresses inflation expectations durably"
    - "Global savings glut re-emerges as emerging market surplus economies expand"

# ============================================================
# 2-YEAR FORECAST MODEL (src/forecasting) — 主观输入 / user views
# 10Y = 预期短端利率均值 (expectations) + 期限溢价 (term premium) + basis + overlay
# Canada 10Y = US 10Y + Canada–US spread (driven by BoC − Fed policy differential)
# Period keys accept "2027Q2", "2027-06" or "2027-06-30"; values between anchors are
# linearly interpolated monthly, and the path starts from the latest observed value.
# ⚠️ All numbers below are EXAMPLES — update every quarter.
# ============================================================
forecast:
  enabled: true
  horizon_months: 24
  # Optional local copy of NY Fed ACMTermPremium.xls (if the automatic download is blocked).
  # null → try download, fall back to Kim-Wright (THREEFYTP10).
  acm_file: null

  # ---- 1. Policy-rate scenarios (最重要的主观输入) --------------------------
  # fed_funds / boc_rate: expected policy rate (%) at the END of each period.
  # boc_rate may be omitted → derived from the BoC model path + Fed pass-through.
  # term_premium_target (optional, %): scenario-specific TP destination, e.g. a fiscal-stress
  #   scenario with a higher TP. Omit to use the global term_premium setting below.
  # probability: weights are rescaled to sum to 1 (together with model_scenario).
  scenarios:
    - name: "Base"
      probability: 0.55
      fed_funds: {"2026Q4": 3.375, "2027Q2": 3.125, "2027Q4": 3.125, "2028Q3": 3.125}
      boc_rate:  {"2026Q4": 2.25,  "2027Q2": 2.25,  "2027Q4": 2.50,  "2028Q3": 2.75}
    - name: "Hawkish"
      probability: 0.20
      fed_funds: {"2026Q4": 3.625, "2027Q2": 3.875, "2027Q4": 3.875, "2028Q3": 3.625}
      boc_rate:  {"2026Q4": 2.50,  "2027Q2": 2.75,  "2027Q4": 3.00,  "2028Q3": 3.00}
      term_premium_target: 1.25
    - name: "Dovish"
      probability: 0.15
      fed_funds: {"2026Q4": 3.125, "2027Q2": 2.375, "2027Q4": 2.125, "2028Q3": 2.375}
      boc_rate:  {"2026Q4": 2.00,  "2027Q2": 1.75,  "2027Q4": 1.75,  "2028Q3": 2.00}

  # Endogenous Taylor-rule scenario (objective cross-check). probability 0 = shown in
  # params only, not part of the forecast.
  model_scenario:
    include: true
    name: "Model (Taylor rule)"
    probability: 0.10

  # Taylor rule for the model scenario (rho = monthly inertia; null = estimate from data)
  taylor_rule:
    r_star: 1.0                 # real neutral rate (%)
    inflation_target: 2.0
    a_pi: 0.5
    a_gap: 1.0
    okun: 2.0
    rho: null
    inflation_halflife: 12      # months for core PCE gap to halve (if no path given)
    unemployment_halflife: 18
    # inflation_path: {"2027Q2": 2.6, "2027Q4": 2.3}     # optional core PCE YoY view
    # unemployment_path: {"2027Q2": 4.6}                 # optional unemployment view

  # Share of Fed moves passed through to the BoC when boc_rate is not specified
  boc_fed_passthrough: 0.5

  # ---- 2. Expectations component ------------------------------------------------
  # Nominal neutral rates: null → long_run_fed_funds / long_run_boc_rate above
  neutral_fed_funds: null
  neutral_boc_rate: null
  expectations:
    convergence_halflife_months: 36   # how fast short rates converge to neutral beyond the horizon
    basis_halflife_months: 12         # how fast today's model-vs-market gap fades

  # ---- 3. Term premium -----------------------------------------------------------
  term_premium:
    target: "historical"        # number (e.g. 0.75) = subjective view | "historical" | "regression"
    historical_window_years: 10
    halflife_months: null       # null = estimated AR(1) speed
    drivers:                    # used when target = "regression" (null/omitted → latest value)
      # deficit_gdp: -6.5       # federal deficit % GDP (negative = deficit)
      # us_10y_rvol_12m: 7.0    # realised 10Y volatility, bps/day

  # ---- 4. Canada–US spread -------------------------------------------------------
  canada_spread:
    target: "model"             # number (pp, e.g. -0.60) = subjective view | "model"
    halflife_months: null       # used only with a numeric target
    sample_start: "2000-01-01"

  # ---- 5. Judgmental overlay (final add-on, bps; 0 at forecast start) -------------
  overlay:
    us_10y_bps: {}              # e.g. {"2027Q2": 10, "2028Q3": 0}
    canada_10y_bps: {}

  # ---- 6. Uncertainty bands ------------------------------------------------------
  uncertainty:
    n_sims: 5000
    block_months: 6
    sample_years: 15            # history used for bootstrapped monthly changes
    scale: 1.0                  # widen (>1) / narrow (<1) the bands
    seed: 42

  # ---- 7. Backtest -----------------------------------------------------------------
  backtest:
    start: "2005-01-31"
    trailing_neutral_years: 10
    include_in_report: true
